<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portrait Tool</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <section class="panel">
      <h1>Portrait Tool</h1>
      <p>Upload a portrait and render it as a tiled black-and-white procedural composition.</p>
      <label class="dropzone" for="fileInput">
        <input id="fileInput" type="file" accept="image/*" hidden />
        <span>Drop image here or click to upload</span>
      </label>
      <div class="controls">
        <label>Tile size <input id="tileSize" type="range" min="8" max="64" value="20"></label>
        <label>Contrast <input id="contrast" type="range" min="0" max="200" value="100"></label>
        <label>Density <input id="density" type="range" min="0" max="100" value="60"></label>
      </div>
      <div class="buttons">
        <button id="generateBtn">Generate</button>
        <button id="downloadBtn">Download PNG</button>
      </div>
    </section>
    <section class="workspace">
      <canvas id="preview" width="1200" height="1200"></canvas>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
